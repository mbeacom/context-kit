name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace manifest
        run: claude plugin validate . --strict
      - name: Validate plugins
        run: |
          for p in plugins/*/; do
            if [ -f "$p/.claude-plugin/plugin.json" ]; then
              echo "::group::validate $p"
              claude plugin validate "$p" --strict
              echo "::endgroup::"
            fi
          done

  version-bump:
    runs-on: ubuntu-latest
    # Pull requests only: a push to `main` has no PR base ref, and diffing
    # `main` against itself yields nothing to gate.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate needs real history to compute merge-base(base, HEAD).
          fetch-depth: 0
      - name: Check shipped content carries a version bump
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash plugins/plugin-forge/scripts/check-version-bump.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The `check-adr` hook skips when Node is absent so contributors are never
      # blocked (ADR-0001). CI pins a Node version so the ADR corpus is actually
      # gated here rather than silently skipped.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run standard-library plugin tests
        run: |
          python3 -m unittest discover -s plugins/runtime-evidence/tests -p 'test_*.py'
          python3 -m unittest discover -s plugins/verify/tests -p 'test_*.py'
          python3 -m unittest discover -s plugins/context-handoff/tests -p 'test_*.py'
          python3 -m unittest discover -s plugins/memory/tests -p 'test_*.py'
          python3 -m unittest discover -s plugins/corpus-review/tests -p 'test_*.py'
          python3 -m unittest discover -s plugins/deep-review/tests -p 'test_*.py'
          python3 -m unittest discover -s plugins/token-economics/tests -p 'test_*.py'
          python3 -m unittest discover -s plugins/plugin-forge/tests -p 'test_command_frontmatter.py'
          python3 -m unittest discover -s plugins/plugin-forge/tests -p 'test_agent_frontmatter.py'
          python3 -m unittest discover -s tests/release -p 'test_*.py'
          python3 -m unittest discover -s tests/integration -p 'test_*.py'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install OpenBLAS (turbovec native dependency)
        # turbovec's Linux extension references cblas symbols (cblas_sgemm) that
        # are not bundled; provide a system OpenBLAS and preload it so the
        # dynamic loader resolves them at import time.
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Run indexkit tests
        working-directory: plugins/indexkit
        run: |
          LIB="$(ldconfig -p | awk '/libopenblas\.so/ {print $NF; exit}')"
          echo "Preloading OpenBLAS: ${LIB:-<none found>}"
          LD_PRELOAD="$LIB" uv run --group dev pytest -q
