name: Release indexkit

# Publishes the `indexkit` Python package to PyPI (ADR-0006 action item 4).
#
# Trigger: the plugin release tag this repository already defines in
# `docs/releasing.md` — `indexkit/v<version>`. A bare `v0.6.0` would not say
# *what* is at 0.6.0 in a tree that ships 14 plugins, and would force every
# publishable component onto one shared version line. One tag drives both
# distributions of the same release; see ADR-0008.
#
# `workflow_dispatch` runs verification only. It never publishes, so a
# maintainer can rehearse the whole pipeline without spending a tag.
#
# Credentials: none. Publishing uses PyPI Trusted Publishing (OIDC), so no PyPI
# API token exists in this repository's secrets. That binds the publisher to
# (owner, repo, THIS workflow filename, environment `pypi`) — renaming this file
# breaks publishing until the PyPI configuration is updated to match.

on:
  push:
    tags:
      - "indexkit/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse, e.g. indexkit/v0.6.0 (verification only; never publishes)"
        required: true
        type: string

permissions:
  contents: read

# A re-run must not race a first run into a duplicate upload. In-progress runs
# are left alone: cancelling mid-publish is worse than letting one finish.
concurrency:
  group: release-indexkit-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: indexkit
  PLUGIN_DIR: plugins/indexkit

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release tag
        id: resolve
        env:
          # `github.ref_name` is the tag on a tag push; the dispatch input is a
          # rehearsal target and need not exist as a tag yet.
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          # Quoted inside ${..} so the prefix is stripped literally rather than
          # being treated as a glob pattern (shellcheck SC2295).
          echo "version=${RAW_TAG#"$PACKAGE"/v}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $RAW_TAG"

      # First, and blocking. A wrong version is the only failure here that
      # cannot be undone after the fact: PyPI files cannot be replaced, only
      # yanked, and the version number is permanently consumed.
      - name: Reconcile tag against every version surface
        env:
          # Via env, not `${{ }}` inline: an expression is substituted into the
          # script text before bash parses it, so a tag containing a quote would
          # break out of the quoting and execute. The value is attacker-shaped —
          # `workflow_dispatch` input is free-form text.
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          python3 scripts/release_version.py \
            --package "$PACKAGE" \
            --tag "$TAG" \
            --plugin-dir "$PLUGIN_DIR"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install OpenBLAS (turbovec native dependency)
        # Mirrors validate.yml: turbovec's Linux extension references cblas
        # symbols that are not bundled, so provide a system OpenBLAS and preload
        # it for the dynamic loader.
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Run the test suite
        working-directory: plugins/indexkit
        run: |
          LIB="$(ldconfig -p | awk '/libopenblas\.so/ {print $NF; exit}')"
          echo "Preloading OpenBLAS: ${LIB:-<none found>}"
          LD_PRELOAD="$LIB" uv run --group dev pytest -q

      - name: Build sdist and wheel
        working-directory: plugins/indexkit
        run: uv build --out-dir dist

      - name: Check distribution metadata
        working-directory: plugins/indexkit
        # --strict: a rendering warning on the PyPI long description becomes a
        # failure here rather than a broken project page after an upload that
        # cannot be replaced.
        run: uvx twine check --strict dist/*

      - name: Confirm built filenames carry the tagged version
        working-directory: plugins/indexkit
        # The metadata check above validates the artifacts; this checks they are
        # the ones the tag asked for, catching a stale dist/ or a build backend
        # that ignored the declared version.
        #
        # `ls -la`, not `ls -l`: `uv build` writes a `dist/.gitignore`, and an
        # ls that hides dotfiles next to a check that sees them is how the first
        # version of this step came to print two correct artifacts and then call
        # them unexpected.
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          ls -la dist
          python3 ../../scripts/check_dist_artifacts.py \
            --dist-dir dist \
            --package "$PACKAGE" \
            --version "$VERSION"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: indexkit-dist
          # Explicit distribution globs, not the whole directory: `uv build`
          # leaves a `dist/.gitignore` behind, and whether a stray file breaks
          # the upload depends on whether `pypa/gh-action-pypi-publish` globs or
          # enumerates — an implementation detail of a moving `release/v1` ref
          # that would be exercised for the first time after a tag was spent.
          # Sending only what is publishable means that question cannot decide
          # whether a release succeeds.
          path: |
            plugins/indexkit/dist/*.whl
            plugins/indexkit/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    # Verification is a hard gate: this job does not exist if `verify` failed,
    # so there is no path that publishes unverified artifacts.
    needs: verify
    # Tag pushes only, and *only* real pushes. `workflow_dispatch` can be run
    # against a tag ref, in which case `github.ref` is `refs/tags/...` too — so
    # a ref check alone would let a rehearsal publish, which is precisely the
    # thing the dispatch path exists to make impossible. The event check is what
    # actually enforces "a dispatch never publishes".
    #
    # The prefix is pinned rather than testing for any tag: `on.push.tags`
    # already filters to `indexkit/v*`, but that filter and this condition are
    # independently editable, and the failure they would jointly permit — this
    # workflow publishing `indexkit` off some other component's tag — is an
    # irreversible upload. Defense in depth is cheap here; the mistake is not.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/indexkit/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indexkit
    permissions:
      # Mint the short-lived OIDC token Trusted Publishing exchanges for an
      # upload credential. No PyPI API token is stored in this repository.
      id-token: write
    steps:
      - name: Download verified distributions
        # Publishes exactly what `verify` built and checked, never a rebuild.
        uses: actions/download-artifact@v8
        with:
          name: indexkit-dist
          path: dist

      - name: Publish
        # PyPA publishes this action from a moving `release/v1` branch and
        # documents that reference; it is the upstream-supported entry point.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Default (false). A version already on PyPI means the tag is a
          # mistake, and silently skipping would report success for a release
          # that never happened.
          skip-existing: false
          # Also the upstream default today — stated anyway to guard against a
          # silent attestation-default regression, since `release/v1` is a moving
          # reference. PyPI's JSON API reports `provenance: null` for every file,
          # attested or not, so a flipped upstream default would not show up
          # where anyone would look for it. This pin addresses that one failure
          # mode; it does not otherwise bound what a moving ref can change (see
          # ADR-0008 for that trade-off). Requires Trusted Publishing, which the
          # action verifies by the absence of a password, and the
          # `id-token: write` above; both hold here.
          attestations: true

      - name: Keep the published files for the GitHub release
        # `gh-action-pypi-publish` signs each distribution and writes the PEP 740
        # attestation next to it as `<dist>.publish.attestation` (its
        # `attestations.py`, `compose_attestation_mapping`). Those files exist
        # only in this job's workspace, so hand them on. The distributions make
        # the artifact non-empty; attestations ride along only if produced, so
        # the release attaches exactly what really exists.
        uses: actions/upload-artifact@v7
        with:
          name: indexkit-published
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.publish.attestation
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub release
    # After a successful upload only. The release records what PyPI now serves,
    # so it must not exist for a version that failed to publish.
    needs: [verify, publish]
    # The same conjoined guard as `publish`, for the same reason: a dispatch
    # rehearsal must never create a release, even when run against a tag ref.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/indexkit/v')
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets. Nothing else in this workflow
      # can write to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The tagged commit (the default ref on a tag push) supplies the
          # changelog. `gh` authenticates via GH_TOKEN, so the checkout token
          # need not be left on disk.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download published distributions
        uses: actions/download-artifact@v8
        with:
          name: indexkit-published
          path: dist

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Render release notes
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          python3 scripts/release_notes.py render \
            --tag "$TAG" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        # Idempotent, so a re-run after a partial failure converges: a missing
        # release is created; an existing one keeps its notes (a maintainer may
        # have added to them, e.g. an attestation gap) and only has its assets
        # replaced (`--clobber`). `--latest=false` because independent version
        # lines share this repository, and `--verify-tag` refuses to let `gh`
        # invent a tag that does not already exist.
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.whl dist/*.tar.gz dist/*.publish.attestation dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; keeping its notes and refreshing assets."
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            # Assets go in with the create, so the release is never visible
            # without them (and still works if releases are made immutable).
            gh release create "$TAG" \
              --verify-tag \
              --latest=false \
              --title "$PACKAGE $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${assets[@]}"
          fi
