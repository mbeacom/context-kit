name: ADR

on:
  push:
    branches: [main]
    paths:
      - "docs/adr/**"
      - ".github/workflows/adr.yml"
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint ADR corpus
        run: npx --yes @adrkit/cli@0.9.0 lint --dir docs/adr

  governing-decisions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      # adrkit v0.9.0, pinned to the release commit rather than a moving tag.
      - uses: mbeacom/adrkit/packages/ci@e66b43dd87d49648a7b28630fa9ecfff65225f2e
        with:
          dir: docs/adr
