name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r docs/requirements.txt
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Generate ADR badge reports
        run: |
          mkdir -p site/adrkit
          npx --yes @adrkit/cli@0.9.0 lint --dir docs/adr --json > site/adrkit/lint.json
          npx --yes @adrkit/cli@0.9.0 queue --dir docs/adr --format json > site/adrkit/queue.json
          python3 -c "import json,sys; d=json.load(open('site/adrkit/lint.json')); sys.exit(0 if type(d.get('checked')) is int else 'checked missing')"
          python3 -c "import json,sys; d=json.load(open('site/adrkit/queue.json')); sys.exit(0 if type(d.get('totalItems')) is int else 'totalItems missing')"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Publish only from the default branch; PRs just build to catch breakage.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
