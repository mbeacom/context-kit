# Agent Package Manager (APM) manifest — https://github.com/microsoft/apm
# Lets APM users install this plugin alongside the Claude Code / GitHub Copilot
# flows: `apm install indexkit@context-kit`. There is no `.apm/`
# directory, so the plugin-native layout (.claude-plugin/plugin.json + skills/ +
# bin/) stays authoritative; APM consumes it as a plugin collection.
# Keep name/version/description in sync with .claude-plugin/plugin.json.
#
# APM does not run the Claude SessionStart bootstrap hook, so the bin/indexkit venv
# must be bootstrapped manually (same as GitHub Copilot). Config uses the
# CONTEXT_KIT_* env vars, not Claude userConfig. See docs/APM.md.
name: indexkit
version: 0.5.0
description: Local-first semantic/hybrid RAG with a configurable Ollama endpoint, turbovec, SQLite FTS5/BM25, and deterministic rank fusion.
author: Mark Beacom
license: MIT
homepage: https://github.com/mbeacom/context-kit
repository: https://github.com/mbeacom/context-kit
keywords: [rag, vector-search, turbovec, ollama, embeddings, semantic, bm25, hybrid]
