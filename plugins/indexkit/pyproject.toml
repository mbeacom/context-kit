[project]
name = "indexkit"
version = "0.5.0"
description = "Offline hybrid retrieval: build a local semantic + BM25 index over your files and query it. Local RAG with ollama, turbovec, and SQLite FTS5."
requires-python = ">=3.10"
keywords = [
  "rag",
  "local-rag",
  "offline",
  "hybrid-retrieval",
  "semantic-search",
  "bm25",
  "embeddings",
  "ollama",
  "vector-search",
]
dependencies = [
  "turbovec>=0.5",
  "httpx>=0.27",
]

[project.scripts]
indexkit = "indexkit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexkit"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
