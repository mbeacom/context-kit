[project]
name = "indexkit"
version = "0.6.7"
description = "Offline hybrid retrieval: build a local semantic + BM25 index over your files and query it. Local RAG with ollama, turbovec, and SQLite FTS5."
requires-python = ">=3.10"
keywords = [
  "rag",
  "local-rag",
  "offline",
  "hybrid-retrieval",
  "semantic-search",
  "bm25",
  "embeddings",
  "ollama",
  "vector-search",
]
dependencies = [
  "turbovec>=0.5",
  "httpx>=0.28.1",
  # Security floors for httpx's transitive dependencies. httpx does not pin
  # them, so without these a fresh install could keep a vulnerable version:
  # anyio < 4.14.2 (TLS hostname IDNA spoofing) and certifi < 2026.10.19
  # (trusts the compromised emSign root CAs).
  "anyio>=4.14.2",
  "certifi>=2026.10.19",
]
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mark Beacom" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/mbeacom/context-kit"
Repository = "https://github.com/mbeacom/context-kit"
Changelog = "https://github.com/mbeacom/context-kit/blob/main/plugins/indexkit/CHANGELOG.md"
Issues = "https://github.com/mbeacom/context-kit/issues"

[project.scripts]
indexkit = "indexkit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexkit"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
