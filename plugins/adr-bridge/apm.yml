# Agent Package Manager (APM) manifest — https://github.com/microsoft/apm
# Keep name/version in sync with .claude-plugin/plugin.json; description is a
# concise APM/CLI listing variant.
name: adr-bridge
version: 0.1.0
description: Bridges an adrkit decision corpus to context-kit's durable memory and semantic retrieval — optional and invocation-only.
author: Mark Beacom
license: MIT
homepage: https://github.com/mbeacom/context-kit
repository: https://github.com/mbeacom/context-kit
keywords: [adr, adrkit, governance, decision-memory, architecture-decisions, retrieval, claude-code, copilot]

dependencies:
  apm:
    # Mirrors plugin.json "dependencies": ["verify"]. APM does not read that
    # Claude field, so declare the sibling plugin explicitly. verify owns the
    # enforced read-only inspection runner whose `governance` operations this
    # plugin calls; memory and indexkit stay optional by design
    # (ADR-0003), so they are deliberately not dependencies.
    - path: ../verify
